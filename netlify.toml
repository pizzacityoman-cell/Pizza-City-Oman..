# ==============================================================================
# Pizza City Oman — Netlify Production Configuration
# ==============================================================================

[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--prefer-offline --no-audit"

# ------------------------------------------------------------------------------
# API & Backend Proxying (Railway Backend)
# ------------------------------------------------------------------------------

# Admin API endpoints
[[redirects]]
  from = "/admin/api/*"
  to = "https://pizza-city-oman-production.up.railway.app/admin/api/:splat"
  status = 200
  force = true

# Public API endpoints
[[redirects]]
  from = "/api/*"
  to = "https://pizza-city-oman-production.up.railway.app/api/:splat"
  status = 200
  force = true

# Backend health check
[[redirects]]
  from = "/health"
  to = "https://pizza-city-oman-production.up.railway.app/health"
  status = 200
  force = true

# ------------------------------------------------------------------------------
# SPA Client Routing Fallback
# Serves existing prerendered static route files first (status 200 without force),
# falls back to /index.html for client-side hydration.
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ------------------------------------------------------------------------------
# Global Security & Standard Headers
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# ------------------------------------------------------------------------------
# Immutable Static Asset Caching (Vite Hashed JS / CSS Chunks)
# ------------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ------------------------------------------------------------------------------
# Web Fonts Caching & CORS
# ------------------------------------------------------------------------------
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# ------------------------------------------------------------------------------
# Static Media, Icons & SEO Files Caching
# ------------------------------------------------------------------------------
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=86400"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=86400"

# ------------------------------------------------------------------------------
# HTML Documents & Shells (Never serve stale cached HTML after deployment)
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"